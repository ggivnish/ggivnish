<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/x-icon" href="/Ffavicon.svg">
    <title>I'm So Foldy | Children's Book Series</title>
    <style>
        /* Base Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            line-height: 1.6;
            background-color: #fcf9f2;
        }
        h1, h2, h3 {
            color: #2c3e50;
        }
        a {
            text-decoration: none;
        }
        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            overflow: hidden;
        }
        .btn {
            display: inline-block;
            background: #e67e22;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn:hover {
            background: #d35400;
        }

        /* New Button Styles for Book Cards */
        .btn-small {
            padding: 8px 16px;
            font-size: 0.95rem;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        /* Hero Section (With Background Image) */
        #hero {
            background: linear-gradient(rgba(41, 128, 185, 0.75), rgba(52, 152, 219, 0.75)), url('images/hero-background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #fff;
            padding: 120px 0;
            text-align: center;
        }
        #hero h1 {
            color: #fff;
            font-size: 3.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        #hero p {
            font-size: 1.3rem;
            max-width: 600px;
            margin: 0 auto 30px auto;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        /* Featured Books */
        #books {
            padding: 60px 0;
            text-align: center;
        }
        #books h2 {
            font-size: 2.5rem;
            margin-bottom: 40px;
        }
        .book-grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        .book-card {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            padding: 30px;
            width: 280px;
            display: flex;
            flex-direction: column;
        }
        .book-card h3 {
            color: #e67e22;
            margin-bottom: 10px;
        }
        .book-card p {
            flex-grow: 1; /* Keeps buttons aligned at the bottom if text length varies */
        }

        /* Carousel Styles */
        .carousel {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .carousel img.slide {
            display: none; /* Hides all images by default */
            width: 100%;
            height: auto;
            border-radius: 10px;
        }
        .carousel img.active {
            display: block; /* Only shows the active image */
        }
        /* Navigation Arrows */
        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            padding: 8px 12px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            transition: 0.3s ease;
            user-select: none;
            background-color: rgba(0,0,0,0.4);
            border: none;
        }
        .prev {
            left: 0;
            border-radius: 0 3px 3px 0;
        }
        .
